name: GoReleaser

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.26'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # The release text is the tag's section of CHANGELOG.md. A tag without one falls back to
      # GoReleaser's list of commits.
      - name: Release notes from CHANGELOG.md
        run: |
          if python3 scripts/release-changelog.py --notes CHANGELOG.md "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"; then
            echo "GORELEASER_ARGS=release --clean --release-notes=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"
          else
            echo "GORELEASER_ARGS=release --clean" >> "$GITHUB_ENV"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ env.GORELEASER_ARGS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}